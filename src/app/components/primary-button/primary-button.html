<button type="button" class="text-white bg-gradient-to-r from-blue-500 via-blue-600 to-blue-700 focus:ring-1 focus:outline-none focus:ring-blue-300 dark:focus:ring-blue-800 font-medium rounded-lg text-sm px-5 py-2.5 text-center me-2 mb-2 w-full" 
  [ngClass]="[
    isDisabled() ? 'opacity-50 cursor-not-allowed' : 'hover:bg-gradient-to-br cursor-pointer',
    extraClass()
  ]"
  (click)="btnClick.emit()"
  [disabled]="isDisabled()"
>
  {{ label() }}
</button>
