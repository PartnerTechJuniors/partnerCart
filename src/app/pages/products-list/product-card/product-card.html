<div class="w-full bg-white rounded-xl shadow-md flex flex-col overflow-hidden relative transition-all group">
  <div [routerLink]="['product', convertToSlug(p().title)]" class="cursor-pointer p-3">
    <img
      class="w-full object-contain p-6 rounded-t-xl max-h-56 mx-auto mt-4 h-56 hover:scale-110 transition-all transform duration-700"
      [src]="p().thumbnail"
      alt="product image"
      loading="eager"
    />
  
    <span
      class="absolute top-3 right-3 text-xs font-semibold px-2.5 py-0.5 rounded-md" [class]="p().stock ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'"
    >
      @if(p().stock){ Disponible } @else { Agotado }
    </span>
  
    <div>
      <p class="uppercase text-sm">
        {{ p().brand || 'GENERICA'}}
      </p>
      <h5
        class="text-base font-semibold tracking-tight text-gray-900 leading-snug line-clamp-2 h-14"
      >
        {{ p().title }}
      </h5>
      <div class="pb-3">
        <app-stars [rating]="p().rating" />
      </div>
      
      <div class="font-medium flex flex-col">
        <div class="flex gap-2">
          <span class="text-lg text-gray-500">{{ priceWithDiscount() | currency: 'S/ ' }}</span>
          @if(discountPercentageRound() > 0){
            <div class="bg-red-500 text-white p-1 rounded-md text-xs">-{{ discountPercentageRound() }}%</div>
          }
        </div>
        <span class="text-base line-through text-gray-400"
          [ngClass]="discountPercentageRound() > 0 ? 'opacity-100' : 'opacity-0'"
        >{{ p().price | currency: 'S/ ' }}</span>
      </div>
    </div>
  </div>

  <div class="p-3">
    <app-primary-button 
    label="Agregar al carro" 
    [extraClass]="p().stock === 0 ? 'group-hover:opacity-50 opacity-0 animation-opacity duration-300 text-lg' : 'group-hover:opacity-100 opacity-0 animation-opacity duration-300 text-lg'"
    (btnClick)="cartService.addToCart(p())" 
    [isDisabled]="p().stock === 0" />
  </div>
</div>
