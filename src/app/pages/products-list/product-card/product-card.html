<div class="w-full max-w-sm bg-white border border-gray-200 rounded-xl shadow-md flex flex-col overflow-hidden relative transition-all hover:shadow-lg">
  <a href="#" class="">
    <img
      class="w-full object-contain p-6 rounded-t-xl max-h-56 mx-auto mt-4"
      [src]="p().image"
      alt="product image"
      loading="eager"
    />
  </a>

  <span
    class="absolute top-3 right-3 text-xs font-semibold px-2.5 py-0.5 rounded-md" [class]="p().stock ? 'bg-blue-100 text-blue-800 dark:bg-blue-200 dark:text-blue-900' : 'bg-red-100 text-red-800 dark:bg-red-200 dark:text-red-900'"
  >
    @if(p().stock){ {{ p().stock }} left } @else { Out of stock }
  </span>

  <div class="flex flex-col justify-between flex-1 px-5 pb-5">
    <div>
      <h5
        class="text-lg font-semibold tracking-tight text-gray-900 leading-snug line-clamp-2 h-14"
      >
        {{ p().title }}
      </h5>
      <span class="text-lg font-bold text-gray-900">
        {{ p().price | currency: 'S/. ' }}
      </span>
    </div>

    <div class="pt-3">
      <app-primary-button label="Add to cart" (btnClick)="cartService.addToCart(p())" [isDisabled]="p().stock === 0" />
    </div>
  </div>
</div>
