<div
  class="border-b border-gray-200"
>
  <div class="flex gap-5 justify-between items-center py-4">
    <div class="flex gap-5 w-1/2">
      <img
        [src]="item().thumbnail"
        alt="{{ item().title }}"
        class="size-32 object-contain p-4"
      />
  
      <div>
        <h3 class="text-base font-semibold text-gray-800">
          {{ item().title }}
        </h3>
        <span class="uppercase text-sm">{{ item().brand }}</span>
      </div>
    </div>

    <div class="font-medium flex flex-col">
        <div class="flex gap-2">
          <span class="text-lg text-gray-500">{{ priceWithDiscount() | currency: 'S/ ' }}</span>
          @if(discountPercentageRound() > 0){
            <div class="bg-red-500 text-white p-1 rounded-md text-xs">-{{ discountPercentageRound() }}%</div>
          }
        </div>
        <span class="text-base line-through text-gray-400"
          [ngClass]="discountPercentageRound() > 0 ? 'opacity-100' : 'opacity-0'"
        >{{ item().price | currency: 'S/ ' }}</span>
    </div>

    <div class="flex items-end gap-10 flex-col-reverse">
      <app-quantity-selector [item]="item()" />

      <app-button
        (btnClicked)="cartService.removeFromCart(item().id)"
      >
        <app-icontrash />
      </app-button>
    </div>
  </div>
</div>
